<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c7da0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5276;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Pipe and Flame Icon -->
  <g transform="translate(5, 8)">
    <!-- Vertical Pipe -->
    <rect x="8" y="10" width="12" height="45" rx="2" fill="url(#blueGradient)"/>
    <!-- Horizontal Pipe -->
    <rect x="0" y="20" width="35" height="12" rx="2" fill="url(#blueGradient)"/>
    <!-- Pipe Joint Circle -->
    <circle cx="14" cy="26" r="8" fill="#1a5276" stroke="#2c7da0" stroke-width="2"/>
    <!-- Flame Symbol -->
    <path d="M45 50 Q50 35 48 25 Q55 35 52 45 Q58 30 55 20 Q65 35 58 50 Q55 55 50 55 Q45 55 45 50"
          fill="#e67e22" opacity="0.9"/>
    <path d="M48 50 Q52 40 50 32 Q56 40 53 48 Q50 52 48 50"
          fill="#f39c12"/>
    <!-- Water Drops -->
    <ellipse cx="28" cy="58" rx="3" ry="4" fill="#3498db" opacity="0.8"/>
    <ellipse cx="36" cy="54" rx="2" ry="3" fill="#3498db" opacity="0.6"/>
  </g>

  <!-- Company Name -->
  <text x="75" y="35" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a5276">Patrick's</text>
  <text x="75" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#2c7da0">Plumbing &amp; Heating</text>

  <!-- Tagline -->
  <text x="75" y="72" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#666" letter-spacing="1">GAS SAFE &amp; OFTEC REGISTERED</text>
</svg>
