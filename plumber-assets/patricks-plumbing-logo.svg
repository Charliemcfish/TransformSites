<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5276;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Stylized P in circle -->
  <circle cx="28" cy="30" r="26" fill="url(#blueGradient)"/>
  <text x="28" y="42" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">P</text>

  <!-- Company Name -->
  <text x="65" y="28" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1a5276">Patrick's</text>
  <text x="65" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#3498db">Plumbing &amp; Heating</text>
</svg>
